# Single-node match-infra Loki configuration.
# Keep this aligned with the live Helm release: SingleBinary, no external
# memcached caches, and a no-surge gateway rollout for required anti-affinity.
backend:
  replicas: 0
  resources:
    limits:
      cpu: 1000m
      memory: 2048Mi
    requests:
      cpu: 200m
      memory: 512Mi
chunksCache:
  enabled: false
deploymentMode: SingleBinary
gateway:
  deploymentStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  enabled: true
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 25m
      memory: 32Mi
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  compactor:
    delete_request_store: filesystem
    retention_delete_delay: 2h
    retention_delete_worker_count: 50
    retention_enabled: true
    working_directory: /var/loki/compactor
  image:
    tag: 3.6.12
  limits_config:
    retention_period: 2160h
  schemaConfig:
    configs:
    - from: "2024-01-01"
      index:
        period: 24h
        prefix: loki_index_
      object_store: filesystem
      schema: v13
      store: tsdb
  storage:
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
    type: filesystem
monitoring:
  dashboards:
    enabled: false
  lokiCanary:
    enabled: false
  rules:
    enabled: false
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  serviceMonitor:
    enabled: false
read:
  replicas: 0
  resources:
    limits:
      cpu: 1000m
      memory: 2048Mi
    requests:
      cpu: 200m
      memory: 512Mi
resultsCache:
  enabled: false
singleBinary:
  persistence:
    size: 10Gi
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
test:
  enabled: false
write:
  replicas: 0
  resources:
    limits:
      cpu: 1000m
      memory: 2048Mi
    requests:
      cpu: 200m
      memory: 512Mi
