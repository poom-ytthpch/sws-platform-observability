# prod env config overrides — HomeLab (single-node, minimal resources)
environment: production
prometheus:
  replicaCount: 1
  storageSize: 5Gi
  resources:
    limits:
      cpu: 1
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 1Gi
alertmanager:
  replicaCount: 1
  storageSize: 2Gi
loki:
  replicaCount: 1
  storageSize: 10Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
tempo:
  replicaCount: 1
  storageSize: 5Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
